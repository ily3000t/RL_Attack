[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-attack"
version = "0.1.0"
description = "Independent PPO attack-and-defense benchmark for Gymnasium, HighwayEnv, and SUMO"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gymnasium>=0.29.1,<1.3",
  "numpy>=1.23,<3",
  "stable-baselines3>=2.3.2,<3",
  "torch>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
sumo = [
  "traci==1.22.0",
  "sumolib==1.22.0",
]
driving = [
  "highway-env>=1.9.1,<2",
]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
dev = [
  "ruff>=0.6,<1",
]

[project.scripts]
rl-attack-baseline = "rl_attack.cli.attack_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

