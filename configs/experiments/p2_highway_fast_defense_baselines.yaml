schema_version: p2_experiment_v1
name: p2_highway_fast_defense_baselines
environment:
  id: highway-fast-v0
  family: highway_env
  optional_dependency: driving
  observation_adapter:
    condition: box_ndim_gt_1
    type: gym.wrappers.FlattenObservation
    order: C
    layout: row-major
    train_clean_evaluation_parity: required
defenses:
  - ../defenses/vanilla_ppo.yaml
  - ../defenses/adv_ppo.yaml
  - ../defenses/sa_ppo.yaml
  - ../defenses/car_ppo_style.yaml
defense_overrides:
  sa_ppo:
    epsilon_schedule_fraction: 0.75
  car_ppo:
    epsilon_schedule_fraction: 0.75
    attack_restarts: 1
    car_soft_lambda: 0.1
    adversarial_loss_coef: 1.0
    policy_consistency_coef: 0.0
    value_consistency_coef: 0.0
training:
  seeds: [0, 1, 2, 3, 4]
  total_timesteps: 1000000
  ppo:
    learning_rate: 0.0003
    n_steps: 1024
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
selection:
  cohort:
    seed_start: 30000
    count: 100
  test_seed_access: forbidden
  objective: clean_robust_pareto
evaluation:
  deterministic: true
  paired_test_cohort:
    seed_start: 40000
    count: 200
  attacks:
    - clean
    - ../attacks/random_uniform.yaml
    - ../attacks/fgsm_ce.yaml
    - ../attacks/pgd_ce.yaml
    - ../attacks/categorical_mad_pgd.yaml
  epsilon_ratios: [0.0, 0.25, 0.5, 1.0, 2.0]
report:
  primary: worst_over_attacks
  driving_metrics:
    - collision_rate
    - lane_change_count
    - speed
  include_clean_robust_pareto: true
  claim_limit: Public-driving P2 baseline; SUMO and P3 adaptive audits remain separate.
