schema_version: p2_defense_v1
key: adv_ppo
display_name: Adv-PPO
entrypoint: rl_attack.cli.defense_baseline
training_mode: adv_ppo
reproduction_level: engineering_baseline
paper_exact_reproduction: false
upstream_runtime_dependency: false
robust_training:
  attack: pgd
  epsilon: 0.02
  attack_steps: 10
  attack_step_size: 0.005
  attack_random_start: true
  attack_restarts: 1
  epsilon_schedule_fraction: 0.0
  adversarial_loss_coef: 1.0
  policy_consistency_coef: 0.0
  value_consistency_coef: 0.0
selection_grid:
  epsilon: [0.01, 0.02, 0.05]
  adversarial_loss_coef: [0.25, 0.5, 1.0]
description: >
  Maintained adversarial-training baseline that adds a PPO objective evaluated
  on bounded adversarial observations. Adv-PPO is not presented as the exact
  reproduction of one uniquely defined paper method.
