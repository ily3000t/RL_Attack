schema_version: p2_defense_v1
key: sa_ppo
display_name: SA-PPO (clean-room objective)
entrypoint: rl_attack.cli.defense_baseline
training_mode: sa_ppo_style
reproduction_level: clean_room_objective
paper_exact_reproduction: false
upstream_runtime_dependency: false
reference:
  repository: SA_PPO
  locked_by: third_party/upstream-lock.json
  runtime_import: forbidden
robust_training:
  attack: pgd
  epsilon: 0.02
  attack_steps: 10
  attack_step_size: 0.005
  attack_random_start: true
  attack_restarts: 1
  epsilon_schedule_fraction: 0.75
  adversarial_loss_coef: 0.0
  policy_consistency_coef: 1.0
  value_consistency_coef: 0.0
selection_grid:
  epsilon: [0.01, 0.02, 0.05]
  policy_consistency_coef: [0.1, 0.5, 1.0]
description: >
  Clean-room SB3 implementation of the state-adversarial policy-consistency
  objective using a maintained PGD inner solver. It is not the original
  SGLD/convex-relaxation implementation and must not be labeled paper-exact.
